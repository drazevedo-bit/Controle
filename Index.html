<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Motorista</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #111827;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .resumo div {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            background: #e5e7eb;
        }

        .valor {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .ganho {
            color: green;
        }

        .gasto {
            color: red;
        }

        .saldo {
            color: #2563eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        @media (max-width: 600px) {
            .resumo {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Controle Financeiro</h1>

    <div class="card">

        <h2>Novo lançamento</h2>

        <label>Data</label>
        <input type="date" id="data">

        <label>Tipo</label>
        <select id="tipo">
            <option value="ganho">Ganho</option>
            <option value="gasto">Gasto</option>
        </select>

        <label>Categoria</label>
        <select id="categoria">
            <option>Uber</option>
            <option>99</option>
            <option>Corrida particular</option>
            <option>Combustível</option>
            <option>Aluguel do carro</option>
            <option>Lavagem</option>
            <option>Pedágio</option>
            <option>Alimentação</option>
            <option>Outros</option>
        </select>

        <label>Valor</label>
        <input type="number" id="valor" placeholder="Ex: 150.00" step="0.01">

        <button onclick="adicionarLancamento()">
            Adicionar
        </button>

    </div>

    <div class="card">

        <h2>Resumo</h2>

        <div class="resumo">

            <div>
                Ganhos
                <div class="valor ganho" id="totalGanhos">
                    R$ 0,00
                </div>
            </div>

            <div>
                Gastos
                <div class="valor gasto" id="totalGastos">
                    R$ 0,00
                </div>
            </div>

            <div>
                Saldo líquido
                <div class="valor saldo" id="saldoLiquido">
                    R$ 0,00
                </div>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>Lançamentos</h2>

        <table>

            <thead>
                <tr>
                    <th>Data</th>
                    <th>Dia</th>
                    <th>Categoria</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="listaLancamentos">
            </tbody>

        </table>

    </div>

</div>

<script>

    let lancamentos = [];

    function adicionarLancamento() {

        const data = document.getElementById("data").value;
        const tipo = document.getElementById("tipo").value;
        const categoria = document.getElementById("categoria").value;
        const valor = parseFloat(document.getElementById("valor").value);

        if (!data || !valor) {
            alert("Preencha a data e o valor.");
            return;
        }

        const dataObjeto = new Date(data + "T12:00:00");

        const diaSemana = dataObjeto.toLocaleDateString(
            "pt-BR",
            {
                weekday: "long"
            }
        );

        const lancamento = {
            data,
            diaSemana,
            tipo,
            categoria,
            valor
        };

        lancamentos.push(lancamento);

        atualizarTela();

        document.getElementById("valor").value = "";
    }


    function atualizarTela() {

        const lista = document.getElementById("listaLancamentos");

        lista.innerHTML = "";

        let totalGanhos = 0;
        let totalGastos = 0;

        lancamentos.forEach(function(item) {

            if (item.tipo === "ganho") {
                totalGanhos += item.valor;
            } else {
                totalGastos += item.valor;
            }

            const linha = document.createElement("tr");

            linha.innerHTML = `
                <td>${formatarData(item.data)}</td>
                <td>${item.diaSemana}</td>
                <td>${item.categoria}</td>
                <td>${item.tipo}</td>
                <td>${formatarDinheiro(item.valor)}</td>
            `;

            lista.appendChild(linha);
        });

        const saldo = totalGanhos - totalGastos;

        document.getElementById("totalGanhos").textContent =
            formatarDinheiro(totalGanhos);

        document.getElementById("totalGastos").textContent =
            formatarDinheiro(totalGastos);

        document.getElementById("saldoLiquido").textContent =
            formatarDinheiro(saldo);
    }


    function formatarDinheiro(valor) {

        return valor.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

    }


    function formatarData(data) {

        const partes = data.split("-");

        return partes[2] + "/" + partes[1] + "/" + partes[0];

    }


    function colocarDataHoje() {

        const hoje = new Date();

        const ano = hoje.getFullYear();

        const mes = String(
            hoje.getMonth() + 1
        ).padStart(2, "0");

        const dia = String(
            hoje.getDate()
        ).padStart(2, "0");

        document.getElementById("data").value =
            `${ano}-${mes}-${dia}`;

    }

    colocarDataHoje();

</script>

</body>
</html>
